# Site settings. Edit these first.
title: Jonas Leo Müller
description: Researcher in machine learning, working on radar sensing, human motion and probabilistic models.
url: "https://jonasmueler.github.io"
baseurl: ""
lang: en

author:
  name: Jonas Leo Müller
  # Fill in what you want shown on the home page. Empty values are hidden.
  photo: /assets/img/profile-4.jpg
  email: "jonas.leo.mueller@fau.de"
  github: jonasmueler
  scholar: "https://scholar.google.com/citations?user=T_DDMYsAAAAJ"
  orcid: ""            # e.g. 0000-0000-0000-0000
  linkedin: "https://www.linkedin.com/in/jonas-m%C3%BCller-841ab6213"

nav:
  - title: About
    url: /
  - title: Learning Materials
    url: /materials/
  - title: Blog
    url: /blog/
  - title: CV
    url: /cv/

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax   # emits \( \) and \[ \]; KaTeX renders them on pages with math: true
  syntax_highlighter: rouge

permalink: /blog/:year/:title/

collections:
  materials:
    output: true
    permalink: /materials/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: materials }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
